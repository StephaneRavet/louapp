name: Deploy Louap on VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd ~/infra/apps/louap
            git pull origin main
            cp .env.production .env
            
            # Sauvegarder la base de données avant le déploiement
            if [ -f prisma/dev.db ]; then
              tar -czf backup-$$(date +%Y%m%d-%H%M%S).tar.gz prisma/dev.db
            fi
            
            # Construire et démarrer les conteneurs
            docker compose build
            docker compose up -d
            
            # Nettoyer les anciennes sauvegardes (garder les 7 derniers jours)
            find . -name "backup-*.tar.gz" -mtime +7 -delete
